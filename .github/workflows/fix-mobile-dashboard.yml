name: Fix mobile dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: responsive mobile dashboard and direct login'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/dashboard/page.tsx'); s=p.read_text()
          s=s.replace("import { Activity, ArrowUpRight, BarChart3, Check, Copy, ExternalLink, LayoutDashboard, LogOut, Package, Plus, Search, Settings, Store, Users, Zap } from 'lucide-react';","import { Activity, ArrowUpRight, BarChart3, Check, Copy, ExternalLink, LayoutDashboard, LogOut, Menu, Package, Plus, Search, Settings, Store, Users, X, Zap } from 'lucide-react';")
          s=s.replace("[user,setUser]=useState<any>(null),[org,setOrg]=useState<any>(null),[products,setProducts]=useState<Product[]>([]),[events,setEvents]=useState<any[]>([]),[storefront,setStorefront]=useState<any>(null),[active,setActive]=useState('overview'),[loading,setLoading]=useState(true),[error,setError]=useState(''),[range,setRange]=useState(30),[copied,setCopied]=useState(false);","[user,setUser]=useState<any>(null),[org,setOrg]=useState<any>(null),[products,setProducts]=useState<Product[]>([]),[events,setEvents]=useState<any[]>([]),[storefront,setStorefront]=useState<any>(null),[active,setActive]=useState('overview'),[loading,setLoading]=useState(true),[error,setError]=useState(''),[range,setRange]=useState(30),[copied,setCopied]=useState(false),[menuOpen,setMenuOpen]=useState(false);")
          s=s.replace("const logout=async()=>{await supabase.auth.signOut();window.location.href='/login'};","const logout=async()=>{await supabase.auth.signOut();window.location.href='/login'}; const selectNav=(k:string)=>{setActive(k);setMenuOpen(false)};")
          s=s.replace('<aside className="sidebar"><div className="sidebar-brand">','<aside className={`sidebar ${menuOpen?\'mobile-open\':\'\'}`}><div className="sidebar-mobile-head"><div className="hub-logo">P</div><strong>Product Hub</strong><button className="mobile-menu-close" onClick={()=>setMenuOpen(false)} aria-label="Fechar menu"><X size={20}/></button></div><div className="sidebar-brand">')
          s=s.replace("onClick={()=>k==='settings'?window.location.assign('/dashboard/settings'):setActive(k)}","onClick={()=>selectNav(k)}")
          s=s.replace('</aside><main className="main-shell"><header className="topbar"><div><span className="topbar-kicker">PRODUCT HUB</span>','</aside>{menuOpen&&<button className="mobile-menu-backdrop" onClick={()=>setMenuOpen(false)} aria-label="Fechar menu"/>}<main className="main-shell"><header className="topbar"><div className="topbar-left"><button className="mobile-menu-button" onClick={()=>setMenuOpen(true)} aria-label="Abrir menu"><Menu size={21}/></button><div><span className="topbar-kicker">PRODUCT HUB</span>')
          s=s.replace("<button onClick={()=>setActive('products')}>Ver catálogo <ArrowUpRight size={14}/></button>","<button onClick={()=>selectNav('products')}>Ver catálogo <ArrowUpRight size={14}/></button>")
          p.write_text(s)
          p=Path('app/login/page.tsx'); s=p.read_text(); old="let destination=searchParams.get('next')||'/dashboard';if(!searchParams.get('next')){try{const {data:membership,error:membershipError}=await withTimeout(supabase.from('organization_members').select('organization_id').eq('user_id',data.user.id).limit(1).maybeSingle(),5000,'workspace-timeout');if(!membershipError&&!membership?.organization_id)destination='/onboarding'}catch{destination='/dashboard'}}router.replace(destination);"; new="const destination=searchParams.get('next')||'/dashboard';router.replace(destination);"; assert old in s; p.write_text(s.replace(old,new))
          p=Path('app/product-hub-overrides.css'); s=p.read_text()
          if 'Mobile dashboard: single menu button' not in s:
            p.write_text(s+r'''
/* Mobile dashboard: single menu button + clean drawer. */
.mobile-menu-button,.sidebar-mobile-head,.mobile-menu-backdrop{display:none}
@media(max-width:620px){
html,body{width:100%;min-width:0;overflow-x:hidden}.app-shell{min-height:100dvh}
.sidebar{display:flex!important;position:fixed!important;left:0!important;top:0!important;bottom:0!important;right:auto!important;width:min(86vw,320px)!important;height:100dvh!important;z-index:120!important;transform:translateX(-105%)!important;transition:transform .22s ease!important;flex-direction:column!important;align-items:stretch!important;padding:14px!important;border-right:1px solid var(--ph-line)!important;border-top:0!important;background:#f8fafc!important;box-shadow:14px 0 40px rgba(20,35,60,.12)!important}
.sidebar.mobile-open{transform:translateX(0)!important}.sidebar-mobile-head{display:flex!important;align-items:center;gap:10px;padding:2px 2px 16px;border-bottom:1px solid var(--ph-line);margin-bottom:14px}.sidebar-mobile-head .hub-logo{width:36px!important;height:36px!important;flex:0 0 36px}.sidebar-mobile-head strong{font-size:15px;color:#172033}.mobile-menu-close{margin-left:auto;border:0;background:transparent;color:#657085;width:36px;height:36px;display:grid;place-items:center;border-radius:9px}.sidebar-brand{display:none!important}.org-switch{display:flex!important}.side-label{display:block!important}.sidebar-spacer,.plan-card,.help,.user-row{display:none!important}.side-nav{display:grid!important;grid-template-columns:1fr!important;gap:5px!important}.side-nav button{display:flex!important;flex-direction:row!important;flex:initial!important;align-items:center!important;justify-content:flex-start!important;gap:11px!important;padding:11px 12px!important;border-radius:10px!important;font-size:13px!important;text-align:left!important}.side-nav button span{font-size:13px!important}.side-nav button.active{background:var(--ph-blue-soft)!important;box-shadow:inset 3px 0 var(--ph-blue)!important}.mobile-menu-backdrop{display:block!important;position:fixed!important;inset:0!important;z-index:110!important;border:0!important;background:rgba(18,28,45,.24)!important;padding:0!important}.main-shell{margin-left:0!important;width:100%!important;max-width:100%!important;padding-bottom:0!important;min-width:0!important}.topbar{height:58px!important;padding:0 12px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;position:sticky!important;top:0!important;z-index:50!important}.topbar-left{display:flex!important;align-items:center!important;gap:10px!important;min-width:0!important}.mobile-menu-button{display:grid!important;place-items:center!important;width:38px!important;height:38px!important;flex:0 0 38px!important;border:1px solid var(--ph-line)!important;background:#fff!important;color:#24324a!important;border-radius:10px!important;box-shadow:none!important}.topbar-title{font-size:14px!important;white-space:nowrap}.topbar-actions{gap:7px!important}.topbar-actions .view-store{display:none!important}.topbar-avatar{width:34px!important;height:34px!important;flex:0 0 34px!important}.page-content{padding:12px 12px 28px!important;width:100%!important;max-width:none!important;box-sizing:border-box!important;overflow:hidden!important}.page-heading{gap:10px!important;align-items:flex-start!important;flex-direction:column!important;margin-bottom:12px!important}.page-heading h1{font-size:27px!important}.page-heading p{font-size:12px!important;line-height:1.45!important}.page-heading .primary{width:100%!important;justify-content:center!important;box-sizing:border-box!important}.dashboard-section{margin-top:8px!important}.section-heading{gap:10px!important;align-items:flex-start!important;flex-direction:column!important}.section-heading>div:last-child{width:100%!important}.range-control{width:100%!important;display:grid!important;grid-template-columns:repeat(3,1fr)!important}.range-control button{min-width:0!important;padding:8px 4px!important}.metric-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.metric{min-width:0!important;padding:13px!important}.metric-top span{font-size:9px!important}.metric strong{font-size:23px!important}.metric small,.metric em{font-size:10px!important}.panel{min-width:0!important;border-radius:14px!important}.panel-head{gap:8px!important;align-items:flex-start!important;flex-wrap:wrap!important}.panel-head>div:first-child{min-width:0!important;flex:1 1 180px!important}.panel-head h2{font-size:16px!important}.panel-head span{font-size:11px!important}.panel-head>button{font-size:11px!important;padding:7px 9px!important}.store-url{display:flex!important;flex-direction:column!important;gap:8px!important;align-items:stretch!important}.store-url>div{min-width:0!important}.store-url>div:first-child span:last-child{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;max-width:100%!important}.store-url>div:last-child{display:grid!important;grid-template-columns:1fr 1fr!important}.product-feed{width:100%!important}.product-feed-row{grid-template-columns:44px minmax(0,1fr)!important;gap:9px!important;padding:11px 0!important}.feed-image{width:44px!important;height:44px!important}.feed-main{min-width:0!important}.feed-main p{display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important;font-size:11px!important}.feed-price{grid-column:2!important;font-size:12px!important}.feed-buy,.no-link{grid-column:2!important;justify-self:start!important;font-size:11px!important}.product-catalog{grid-template-columns:1fr!important;gap:10px!important}.dashboard-product-card{min-width:0!important}.dashboard-product-image{height:190px!important}.dashboard-product-body{padding:14px!important}.dashboard-product-body h2{font-size:17px!important}.dashboard-product-body p{font-size:12px!important}.dashboard-product-footer{gap:8px!important;flex-wrap:wrap!important}.analytics-grid{grid-template-columns:1fr!important;gap:10px!important}.line-chart{min-height:220px!important;overflow:hidden!important}.chart-labels small{font-size:8px!important;overflow:hidden!important}.editor{grid-template-columns:1fr!important;gap:10px!important}.editor-preview{order:-1!important;min-height:460px!important}.preview-stage{padding:12px 8px!important;min-height:420px!important}.store-mini{min-height:420px!important}.emulator-mobile .store-mini{min-height:540px!important;width:min(360px,100%)!important}.settings-wrap{padding:12px 12px 30px!important}.settings-grid{grid-template-columns:1fr!important}.settings-plan-intro{padding:14px!important}.setting-card{padding:15px!important}.settings-panel label{padding:15px!important}
}
@media(max-width:380px){.page-content{padding-left:9px!important;padding-right:9px!important}.metric{padding:11px!important}.metric strong{font-size:21px!important}.topbar-title{font-size:13px!important}.mobile-menu-button{width:36px!important;height:36px!important;flex-basis:36px!important}}
''')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/page.tsx app/login/page.tsx app/product-hub-overrides.css .github/workflows/fix-mobile-dashboard.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: responsive mobile dashboard and direct login'
          git rm .github/workflows/fix-mobile-dashboard.yml
          git commit -m 'chore: remove temporary mobile fix workflow'
          git push
